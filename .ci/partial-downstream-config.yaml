version: "2.1"

# Legenda
# current: the command executed when the PR is opened in the given repo
# upstream: the command executed when the given repo is upstream compared of the one where the PR is open
# downstream: the command executed when the given repo is downstream compared of the one where the PR is open
# #####
# We do not need to verify tests in upstream projects, since those do not risk to be broken by modifications in downstream ones; so, we use the default upstream command
# On the other side, any downsteam repo could be broken by upstream modifications. In this case, we customize the downstream command on a per-repo base to match the current building status (NB/PB/FB) or the repo



dependencies: ./project-dependencies.yaml

pre: |
  export BUILD_MVN_OPTS=${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G" -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3
  echo "BUILD_MVN_OPTS=${{ env.BUILD_MVN_OPTS }}"
  java -version

default:
  build-command:
    current: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu -T1C clean install -Dfull
    upstream: mvn ${{ env.BUILD_MVN_OPTS }} -e -T1C clean install -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true
    downstream: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu clean install -Dfull -Pbusiness-central,wildfly,sourcemaps,no-showcase -Dcontainer=wildfly -Dcontainer.profile=wildfly -Dintegration-tests=true -Dcargo.ignore.failures=true -Dmaven.test.failure.ignore=true -Dmaven.test.redirectTestOutputToFile=true -Dgwt.compiler.localWorkers=1 -Dwebdriver.firefox.bin=/opt/tools/firefox-91esr/firefox-bin -Dgwt.skipCompilation=true
    after:
      upstream: rm -rf ./*

build:
  - project: dba/kiegroup-drools
    build-command:
      current: mvn -e -nsu clean install -Dfull -Dcontainer=wildfly -Dcontainer.profile=wildfly -Dintegration-tests=true -Dcargo.ignore.failures=true -Dmaven.test.failure.ignore=true -Dmaven.test.redirectTestOutputToFile=true -Dgwt.compiler.localWorkers=1 -Dgwt.skipCompilation=true ${{ env.BUILD_MVN_OPTS }}
      downstream: mvn -e -nsu clean install -Dfull -Dcontainer=wildfly -Dcontainer.profile=wildfly -Dintegration-tests=true -Dcargo.ignore.failures=true -Dmaven.test.failure.ignore=true -Dmaven.test.redirectTestOutputToFile=true -Dgwt.compiler.localWorkers=1 -Dgwt.skipCompilation=true ${{ env.BUILD_MVN_OPTS }}

  - project: dba/kiegroup-appformer
    build-command:
      current: mvn -e clean install -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}
      downstream: mvn -e clean install -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}
    archive-artifacts:
      path: |
        **/dashbuilder-runtime.war

  - project: dba/kiegroup-kie-uberfire-extensions
    build-command:
      current: mvn -e clean install -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}
      downstream: mvn -e clean install -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}

  - project: dba/kiegroup-jbpm
    build-command:
      current: mvn -e -fae -nsu clean install -DskipTests -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}
      downstream: mvn -e -fae -nsu clean install -DskipTests -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}

  - project: dba/kiegroup-droolsjbpm-integration
    build-command:
      current: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu -B -T1C clean install -Pjenkins-pr-builder -DskipTests -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true
      downstream: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu -B -T1C clean install -Pjenkins-pr-builder -DskipTests -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true

